# Mutants for tool/mutation_smoke.dart. Each must be killed (its tests fail).
# `find` must occur exactly once in `file`. Keep `tests` narrow: speed.
- id: session.loopCountLeaks
  why: the loop count of a swiped-away view leaked into the next one
  file: lib/src/analytics/chorki_analytics_session.dart
  find: "    _loopCount = 0;\n    _pauseCount = 0;"
  replace: "    _pauseCount = 0;"
  tests: [test/scenarios]
- id: session.firstFrameOncePerLoad
  why: a revisited page reported no first frame
  file: lib/src/analytics/chorki_analytics_session.dart
  find: "    _firstFrameAt = null;\n    _lastSeekAt = null;"
  replace: "    _lastSeekAt = null;"
  tests: [test/scenarios]
- id: watch.segmentEndInclusive
  why: a loop at an exact multiple of 5 s reported a segment past the end
  file: lib/src/analytics/watch_tracker.dart
  find: "final last = (to.inMilliseconds - 1) ~/ len;"
  replace: "final last = to.inMilliseconds ~/ len;"
  tests: [test/scenarios, test/analytics/watch_tracker_test.dart]
- id: watch.percentFromBuckets
  why: 5.1 s of a 6 s short counted as 100 % watched
  file: lib/src/analytics/watch_tracker.dart
  find: "covered += (end < total ? end : total) - start;"
  replace: "covered += _segments.length * segmentLength.inMilliseconds; break;"
  tests: [test/scenarios, test/analytics/watch_tracker_test.dart]
- id: session.consentNotABoundary
  why: granting consent mid-view lost the impression
  file: lib/src/analytics/chorki_analytics_session.dart
  find: "    } else if (!old.isActive && value.isActive && _active) {\n      _beginView();"
  replace: "    } else if (!old.isActive && value.isActive && _active) {"
  tests: [test/scenarios]
- id: session.replayKeepsQuartiles
  why: replaying from the start after the end never reported quartiles

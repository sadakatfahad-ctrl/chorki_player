# Analyzer settings for chorki_player.
#
# Ratchet: a rule is enabled here only when the codebase has zero hits.
# Rules with a backlog are enforced first by a guardrail test in
# test/guardrails/ with a shrink-only allowlist, and move here once clean.
#
# | Rule                                   | Enabled in |
# |----------------------------------------|------------|
# | strict-casts / -inference / -raw-types | M1         |
# | unawaited_futures, close_sinks, ...    | M1         |
# | prefer_relative_imports                | M1         |
# | discarded_futures                      | M5 (13 hits fixed)       |
# | comment_references                     | not used: its 43 hits are valid dartdoc links across layers (adding imports would break layering); `dart doc --dry-run` in tool/check.sh fails on broken links instead |
# | public_member_api_docs                 | M6 (283 members documented) |
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - test/guardrails/fixtures/**
    # Held-out eval tests reference APIs the task has yet to add.
    - eval/**
    - test/eval_hidden/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    avoid_print: error
    unawaited_futures: error
    discarded_futures: error
    cancel_subscriptions: error
    close_sinks: error
    avoid_dynamic_calls: error
    only_throw_errors: error
    use_build_context_synchronously: error
    invalid_use_of_visible_for_testing_member: error
    invalid_use_of_internal_member: error
    deprecated_member_use_from_same_package: ignore

linter:
  rules:
    - public_member_api_docs
    - discarded_futures
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - only_throw_errors
    - prefer_const_constructors
    - prefer_final_fields
    - prefer_final_locals
    - prefer_relative_imports
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_lambdas
